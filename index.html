<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banco de preguntas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F7F4; --ink:#191A19; --muted:#767A73; --line:#E1E2DC;
    --accent:#3D5A4C; --accent-soft:#EAF0EC; --wrong:#A9463A; --wrong-soft:#F7EBE9;
    --serif:'Newsreader', Georgia, serif;
    --sans:'Inter', 'Segoe UI', system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);line-height:1.6;
    font-size:16px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:680px;margin:0 auto;padding:0 24px 90px}
  a{color:var(--accent)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  .rail{position:sticky;top:0;height:3px;background:var(--line);z-index:10}
  .rail i{display:block;height:100%;width:0%;background:var(--accent);transition:width .35s ease}

  header{padding:52px 0 32px}
  .kicker{font-size:.86rem;color:var(--muted)}
  h1{font-family:var(--serif);font-weight:500;font-size:2.1rem;letter-spacing:-.01em;margin-top:6px}
  .lede{color:var(--muted);margin-top:10px;font-size:.98rem;max-width:52ch}

  .stats{display:flex;gap:28px;margin-top:28px;padding-top:22px;border-top:1px solid var(--line);flex-wrap:wrap}
  .stat b{font-family:var(--serif);font-size:1.5rem;font-weight:500;display:block}
  .stat span{font-size:.8rem;color:var(--muted)}

  section{margin-top:44px}
  h2{font-family:var(--serif);font-weight:500;font-size:1.3rem;margin-bottom:14px}

  .topic{border-bottom:1px solid var(--line);padding:18px 0;display:flex;align-items:center;justify-content:space-between;gap:16px;cursor:pointer;background:none;border-left:none;border-right:none;border-top:none;width:100%;text-align:left;font-family:var(--sans)}
  .topic:hover .t-name{color:var(--accent)}
  .topic:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
  .t-name{font-weight:500;font-size:1.02rem;transition:color .12s}
  .t-meta{font-size:.82rem;color:var(--muted);margin-top:3px}
  .t-right{display:flex;align-items:center;gap:10px;flex-shrink:0}
  .t-score{font-size:.82rem;color:var(--accent);font-weight:600}
  .t-arrow{color:var(--muted);font-size:1.1rem}

  .empty{color:var(--muted);font-size:.94rem;font-style:italic}

  .area-row{margin-bottom:14px}
  .area-top{display:flex;justify-content:space-between;font-size:.88rem;margin-bottom:6px}
  .area-top .weak{color:var(--wrong)}
  .bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent)}
  .bar i.weak{background:var(--wrong)}

  .backlink{display:inline-block;margin-bottom:20px;font-size:.88rem;color:var(--muted);background:none;border:none;cursor:pointer;font-family:var(--sans)}
  .backlink:hover{color:var(--ink)}

  .q-meta{display:flex;justify-content:space-between;align-items:baseline;font-size:.8rem;color:var(--muted);margin-bottom:18px}
  .q-area{color:var(--accent);font-weight:600}
  .q-text{font-family:var(--serif);font-size:1.32rem;font-weight:500;line-height:1.42;margin-bottom:28px}

  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{text-align:left;font-family:var(--sans);font-size:.98rem;line-height:1.5;color:var(--ink);
    background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px 16px;cursor:pointer;
    display:flex;gap:12px;transition:border-color .12s}
  .opt:hover:not(:disabled){border-color:var(--accent)}
  .opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .opt:disabled{cursor:default}
  .opt .letter{color:var(--muted);font-weight:600;flex-shrink:0}
  .opt.correct{border-color:var(--accent);background:var(--accent-soft)}
  .opt.correct .letter{color:var(--accent)}
  .opt.wrong{border-color:var(--wrong);background:var(--wrong-soft)}
  .opt.wrong .letter{color:var(--wrong)}
  .opt.dim{opacity:.5}

  .feedback{margin-top:22px;padding:16px 18px;border-radius:8px;font-size:.92rem}
  .feedback.good{background:var(--accent-soft)}
  .feedback.bad{background:var(--wrong-soft)}
  .feedback .verdict{font-weight:600;display:block;margin-bottom:6px}
  .feedback.good .verdict{color:var(--accent)}
  .feedback.bad .verdict{color:var(--wrong)}
  .feedback .basis{display:block;margin-top:8px;color:var(--muted);font-size:.85rem}

  .nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:26px}
  .score-live{font-size:.85rem;color:var(--muted)}

  button.primary{font-family:var(--sans);font-weight:600;background:var(--ink);color:#fff;border:none;
    border-radius:8px;padding:12px 22px;cursor:pointer;font-size:.92rem}
  button.primary:hover{background:#000}
  button.ghost{font-family:var(--sans);font-weight:600;background:none;color:var(--ink);border:1px solid var(--line);
    border-radius:8px;padding:11px 20px;cursor:pointer;font-size:.92rem}
  button.ghost:hover{border-color:var(--ink)}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .result-seal{text-align:center;padding:36px 0 8px}
  .result-seal .pct{font-family:var(--serif);font-size:3.2rem;font-weight:500;display:block}
  .result-seal .of{color:var(--muted);font-size:.92rem;margin-top:4px}
  .verdict-line{text-align:center;color:var(--muted);font-size:.94rem;margin:6px 0 34px}

  .review-item{border-top:1px solid var(--line);padding:16px 0}
  .review-item .rq{font-weight:500;margin-bottom:6px}
  .review-item .ra{color:var(--muted);font-size:.9rem}

  .center{display:flex;gap:10px;justify-content:center;margin-top:36px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="rail"><i id="bar"></i></div>
<div class="wrap" id="app"></div>

<script src="data.js"></script>
<script>
const app=document.getElementById('app'), bar=document.getElementById('bar');
const letters=['A','B','C','D'];
let current=null, idx=0, score=0, results=[], areaTally={}, answered=false;

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}

function getProgress(){try{return JSON.parse(localStorage.getItem('bp_progress')||'{}')}catch{return {}}}
function saveResult(id,r){const p=getProgress();p[id]=r;localStorage.setItem('bp_progress',JSON.stringify(p))}

function renderDashboard(){
  if(typeof BANCO==='undefined'){
    app.innerHTML='<div style="padding:60px 0"><p>Falta el archivo <b>data.js</b> junto a este index.html.</p></div>';
    return;
  }
  bar.style.width='0%';
  const p=getProgress();
  let sumOk=0,sumTot=0; const areas={};
  Object.values(p).forEach(r=>{
    if(!r||!r.total)return;
    sumOk+=r.score; sumTot+=r.total;
    Object.entries(r.byArea||{}).forEach(([a,v])=>{areas[a]=areas[a]||{ok:0,tot:0};areas[a].ok+=v.ok;areas[a].tot+=v.tot});
  });
  const pctGlobal=sumTot?Math.round(sumOk/sumTot*100):null;
  const totalPreg=BANCO.temas.reduce((a,t)=>a+t.preguntas.length,0);

  const topics=BANCO.temas.map(t=>{
    const r=p[t.id];
    const st=r?`<span class="t-score">${Math.round(r.score/r.total*100)}%</span>`:'';
    return `<button class="topic" onclick="startTopic('${esc(t.id)}')">
      <div><div class="t-name">${esc(t.titulo)}</div><div class="t-meta">${t.preguntas.length} preguntas</div></div>
      <div class="t-right">${st}<span class="t-arrow">→</span></div>
    </button>`;
  }).join('');

  const areaEntries=Object.entries(areas).sort((x,y)=>(x[1].ok/x[1].tot)-(y[1].ok/y[1].tot));
  const areaRows=areaEntries.length?areaEntries.map(([a,v])=>{
    const pc=Math.round(v.ok/v.tot*100), weak=pc<70&&v.tot>=3;
    return `<div class="area-row"><div class="area-top"><span>${esc(a)}</span><span class="${weak?'weak':''}">${v.ok}/${v.tot} · ${pc}%</span></div><div class="bar"><i class="${weak?'weak':''}" style="width:${pc}%"></i></div></div>`;
  }).join(''):'<p class="empty">Resuelve tu primera tanda para ver el diagnóstico por área.</p>';

  app.innerHTML=`
    <header>
      <div class="kicker">${esc(BANCO.kicker||'Banco de preguntas')}</div>
      <h1>${esc(BANCO.titulo)}</h1>
      ${BANCO.subtitulo?`<p class="lede">${esc(BANCO.subtitulo)}</p>`:''}
      <div class="stats">
        <div class="stat"><b>${BANCO.temas.length}</b><span>Temas</span></div>
        <div class="stat"><b>${totalPreg}</b><span>Preguntas</span></div>
        <div class="stat"><b>${pctGlobal==null?'—':pctGlobal+'%'}</b><span>Desempeño global</span></div>
      </div>
    </header>
    <section>
      <h2>Temas</h2>
      ${topics||'<p class="empty">Agrega temas en data.js para empezar.</p>'}
    </section>
    <section>
      <h2>Por área</h2>
      ${areaRows}
    </section>`;
}

function startTopic(id){
  const t=BANCO.temas.find(x=>x.id===id); if(!t)return;
  current={id:t.id,titulo:t.titulo,preguntas:shuffle(t.preguntas.slice()).slice(0,20)};
  idx=0;score=0;results=[];areaTally={};answered=false;
  renderQ(); window.scrollTo({top:0});
}

function renderQ(){
  answered=false;
  const qs=current.preguntas, q=qs[idx];
  bar.style.width=(idx/qs.length*100)+'%';
  const opts=q.o;
  app.innerHTML=`
    <button class="backlink" onclick="renderDashboard()">← Volver a temas</button>
    <div class="q-meta"><span class="q-area">${esc(q.c)}</span><span>Pregunta ${idx+1} de ${qs.length}</span></div>
    <p class="q-text">${esc(q.q)}</p>
    <div class="opts">
      ${opts.map((o,i)=>`<button class="opt" data-i="${i}" onclick="answer(${i})"><span class="letter">${letters[i]}</span><span>${esc(o)}</span></button>`).join('')}
    </div>
    <div id="fb"></div>
    <div class="nav-row">
      <span class="score-live">Aciertos: ${score} / ${idx}</span>
      <span id="nextholder"></span>
    </div>`;
}

function answer(i){
  if(answered)return; answered=true;
  const qs=current.preguntas, q=qs[idx], ok=i===q.a;
  if(ok)score++;
  results.push({i:idx,ok});
  areaTally[q.c]=areaTally[q.c]||{ok:0,tot:0};
  areaTally[q.c].tot++; if(ok)areaTally[q.c].ok++;
  document.querySelectorAll('.opt').forEach(btn=>{
    const bi=+btn.dataset.i; btn.disabled=true;
    if(bi===q.a)btn.classList.add('correct');
    else if(bi===i)btn.classList.add('wrong');
    else btn.classList.add('dim');
  });
  document.getElementById('fb').innerHTML=`
    <div class="feedback ${ok?'good':'bad'}">
      <span class="verdict">${ok?'Correcto':'Incorrecto — la respuesta era la '+letters[q.a]}</span>
      ${esc(q.e||'')}
      ${q.b?`<span class="basis">${esc(q.b)}</span>`:''}
    </div>`;
  document.getElementById('nextholder').innerHTML=
    `<button class="primary" onclick="next()">${idx===qs.length-1?'Ver resultado':'Siguiente'}</button>`;
  document.querySelector('.score-live').textContent=`Aciertos: ${score} / ${idx+1}`;
}

function next(){
  idx++;
  if(idx<current.preguntas.length){renderQ();window.scrollTo({top:0,behavior:'smooth'})}
  else renderEnd();
}

function renderEnd(){
  bar.style.width='100%';
  const qs=current.preguntas, pct=Math.round(score/qs.length*100);
  saveResult(current.id,{score,total:qs.length,byArea:areaTally,ts:Date.now()});
  let verdict;
  if(pct>=90)verdict='Excelente dominio de este tema.';
  else if(pct>=70)verdict='Buen resultado — repasa las falladas.';
  else if(pct>=55)verdict='Nivel medio, conviene otro repaso.';
  else verdict='Vale la pena reforzar este tema.';
  const wrong=results.filter(r=>!r.ok);
  const review=wrong.length?`
    <h2 style="margin-top:40px">Para repasar</h2>
    ${wrong.map(r=>{const q=qs[r.i];return `<div class="review-item"><div class="rq">${esc(q.q)}</div><div class="ra">Respuesta correcta: ${letters[q.a]}) ${esc(q.o[q.a])}</div></div>`}).join('')}
  `:'';
  app.innerHTML=`
    <button class="backlink" onclick="renderDashboard()">← Volver a temas</button>
    <div class="result-seal"><span class="pct">${pct}%</span><span class="of">${score} de ${qs.length} correctas · ${esc(current.titulo)}</span></div>
    <p class="verdict-line">${esc(verdict)}</p>
    ${review}
    <div class="center">
      <button class="primary" onclick="renderDashboard()">Volver a temas</button>
      <button class="ghost" onclick="startTopic('${esc(current.id)}')">Otra tanda</button>
    </div>`;
  window.scrollTo({top:0,behavior:'smooth'});
}

renderDashboard();
</script>
</body>
</html>
