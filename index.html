<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exámenes de preparación para Concursos</title>
<style>
  :root{
    --paper:#F7F7F4; --ink:#191A19; --muted:#767A73; --line:#E1E2DC;
    --accent:#2F6B4F; --accent-light:#5FA382; --accent-soft:#EAF3EE;
    --wrong:#A9463A; --wrong-soft:#F7EBE9;
    --font:'Franklin Gothic Book','Franklin Gothic','ITC Franklin Gothic','Segoe UI',Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--paper);color:var(--ink);font-family:var(--font);line-height:1.6;
    font-size:16px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:720px;margin:0 auto;padding:0 24px 90px}
  @media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

  .rail{position:sticky;top:0;height:3px;background:var(--line);z-index:10}
  .rail i{display:block;height:100%;width:0%;background:var(--accent);transition:width .35s ease}

  header{padding:48px 0 28px}
  h1{font-family:var(--font);font-weight:700;font-size:2rem;letter-spacing:-.01em}

  .box{background:#fff;border:2px solid var(--accent);border-radius:12px;padding:24px 26px;margin-top:22px}
  .box h2{font-family:var(--font);font-weight:700;font-size:1.15rem;margin-bottom:8px}
  .box .box-desc{color:var(--muted);font-size:.92rem;max-width:60ch}

  .panel-body{display:flex;align-items:center;gap:22px;margin-top:18px;flex-wrap:wrap}
  .panel-stats{display:flex;gap:26px;flex:1;min-width:220px;flex-wrap:wrap}
  .stat b{font-family:var(--font);font-size:1.5rem;font-weight:700;display:block}
  .stat span{font-size:.78rem;color:var(--muted)}

  section{margin-top:36px}
  h2.section-title{font-family:var(--font);font-weight:700;font-size:1.2rem;margin-bottom:6px}

  .topics-box{padding:8px 26px}
  .topic{border-bottom:1px solid var(--line);padding:16px 0;display:flex;align-items:center;justify-content:space-between;gap:16px;cursor:pointer;background:none;border-left:none;border-right:none;border-top:none;width:100%;text-align:left;font-family:var(--font)}
  .topic:last-child{border-bottom:none}
  .topic:hover .t-name{color:var(--accent)}
  .topic:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
  .t-name{font-weight:700;font-size:1.02rem;transition:color .12s}
  .t-meta{font-size:.82rem;color:var(--muted);margin-top:3px}
  .t-right{display:flex;align-items:center;gap:12px;flex-shrink:0}
  .t-score{font-size:.82rem;color:var(--accent);font-weight:700}
  .t-arrow{color:var(--accent-light);font-size:1.2rem;font-weight:700}

  .empty{color:var(--muted);font-size:.94rem;font-style:italic}

  .area-row{margin-bottom:14px}
  .area-top{display:flex;justify-content:space-between;font-size:.88rem;margin-bottom:6px}
  .area-top .weak{color:var(--wrong)}
  .bar{height:5px;background:var(--line);border-radius:3px;overflow:hidden}
  .bar i{display:block;height:100%;background:var(--accent)}
  .bar i.weak{background:var(--wrong)}

  .backlink{display:inline-block;margin-bottom:20px;font-size:.88rem;color:var(--muted);background:none;border:none;cursor:pointer;font-family:var(--font)}
  .backlink:hover{color:var(--ink)}

  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
  .chip{font-size:.74rem;color:var(--muted);border:1px solid var(--line);border-radius:20px;padding:3px 11px}
  .chip.n1{color:var(--accent)}
  .chip.n3{color:var(--wrong)}

  .q-meta{display:flex;justify-content:space-between;align-items:baseline;font-size:.8rem;color:var(--muted);margin-bottom:14px}
  .q-text{font-family:var(--font);font-size:1.2rem;font-weight:700;line-height:1.42;margin-bottom:20px}

  .statements{margin:0 0 26px 0;padding-left:22px;font-size:.98rem}
  .statements li{margin-bottom:8px}

  .ar-block{margin-bottom:26px}
  .ar-block .lbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .ar-block .claim{font-family:var(--font);font-size:1.08rem;font-weight:700;margin:4px 0 16px;line-height:1.4}
  .ar-block .porque{font-size:.78rem;color:var(--muted);letter-spacing:.06em;margin-bottom:16px}

  .opts{display:flex;flex-direction:column;gap:10px}
  .opt{text-align:left;font-family:var(--font);font-size:.96rem;line-height:1.5;color:var(--ink);
    background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px 16px;cursor:pointer;
    display:flex;gap:12px;transition:border-color .12s}
  .opt:hover:not(:disabled){border-color:var(--accent)}
  .opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .opt:disabled{cursor:default}
  .opt .letter{color:var(--muted);font-weight:700;flex-shrink:0}
  .opt.correct{border-color:var(--accent);background:var(--accent-soft)}
  .opt.correct .letter{color:var(--accent)}
  .opt.wrong{border-color:var(--wrong);background:var(--wrong-soft)}
  .opt.wrong .letter{color:var(--wrong)}
  .opt.dim{opacity:.5}

  .feedback{margin-top:22px;padding:16px 18px;border-radius:8px;font-size:.92rem}
  .feedback.good{background:var(--accent-soft)}
  .feedback.bad{background:var(--wrong-soft)}
  .feedback .verdict{font-weight:700;display:block;margin-bottom:6px}
  .feedback.good .verdict{color:var(--accent)}
  .feedback.bad .verdict{color:var(--wrong)}
  .feedback .basis{display:block;margin-top:8px;color:var(--muted);font-size:.85rem}

  .nav-row{display:flex;justify-content:space-between;align-items:center;margin-top:26px}
  .score-live{font-size:.85rem;color:var(--muted)}

  button.primary{font-family:var(--font);font-weight:700;background:var(--accent);color:#fff;border:none;
    border-radius:8px;padding:12px 22px;cursor:pointer;font-size:.92rem}
  button.primary:hover{background:var(--ink)}
  button.ghost{font-family:var(--font);font-weight:700;background:none;color:var(--ink);border:1px solid var(--line);
    border-radius:8px;padding:11px 20px;cursor:pointer;font-size:.92rem}
  button.ghost:hover{border-color:var(--ink)}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  .result-seal{text-align:center;padding:36px 0 8px}
  .result-seal .pct{font-family:var(--font);font-size:3rem;font-weight:700;display:block}
  .result-seal .of{color:var(--muted);font-size:.92rem;margin-top:4px}
  .verdict-line{text-align:center;color:var(--muted);font-size:.94rem;margin:6px 0 34px}

  .review-item{border-top:1px solid var(--line);padding:16px 0}
  .review-item .rq{font-weight:700;margin-bottom:6px}
  .review-item .ra{color:var(--muted);font-size:.9rem}

  .center{display:flex;gap:10px;justify-content:center;margin-top:36px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="rail"><i id="bar"></i></div>
<div class="wrap" id="app"></div>

<script src="data.js"></script>
<script>
const letters=['A','B','C','D'];
const OPTS_II=["Si las opciones 1, 2 y 3 son correctas","Si las opciones 1 y 3 son correctas","Si las opciones 2 y 4 son correctas","Si solamente la opción 4 es correcta"];
const OPTS_III=["La afirmación y la razón son VERDADERAS y la razón es una explicación CORRECTA de la afirmación","La afirmación y la razón son VERDADERAS, pero la razón NO es una explicación correcta de la afirmación","La afirmación es VERDADERA, pero la razón es FALSA","La afirmación es FALSA, pero la razón es VERDADERA"];
const nivelName={1:'Fácil',2:'Medio',3:'Difícil'};

const app=document.getElementById('app'), bar=document.getElementById('bar');
let current=null, idx=0, score=0, results=[], areaTally={}, answered=false;

function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function dias(){return (typeof DIPLOMADO!=='undefined'&&Array.isArray(DIPLOMADO.dias))?DIPLOMADO.dias:[]}
function optionSet(q){return q.t===2?OPTS_II:q.t===3?OPTS_III:q.o}

function getProgress(){try{return JSON.parse(localStorage.getItem('bp_progress')||'{}')}catch{return {}}}
function saveResult(id,r){const p=getProgress();p[id]=r;localStorage.setItem('bp_progress',JSON.stringify(p))}

function renderDashboard(){
  const list=dias();
  if(!list.length){
    app.innerHTML='<div style="padding:60px 0"><p>Falta el archivo <b>data.js</b> junto a este index.html, o está vacío.</p></div>';
    return;
  }
  bar.style.width='0%';
  const p=getProgress();
  let sumOk=0,sumTot=0; const areas={};
  Object.values(p).forEach(r=>{
    if(!r||!r.total)return;
    sumOk+=r.score; sumTot+=r.total;
    Object.entries(r.byArea||{}).forEach(([a,v])=>{areas[a]=areas[a]||{ok:0,tot:0};areas[a].ok+=v.ok;areas[a].tot+=v.tot});
  });
  const pctGlobal=sumTot?Math.round(sumOk/sumTot*100):null;
  const totalPreg=list.reduce((a,t)=>a+t.preguntas.length,0);

  const topics=list.map(t=>{
    const r=p[t.id];
    const st=r?`<span class="t-score">${Math.round(r.score/r.total*100)}%</span>`:'';
    return `<button class="topic" onclick="startTopic('${esc(t.id)}')">
      <div><div class="t-name">${esc(t.titulo)}</div><div class="t-meta">${t.preguntas.length} preguntas</div></div>
      <div class="t-right">${st}<span class="t-arrow">→</span></div>
    </button>`;
  }).join('');

  const areaEntries=Object.entries(areas).sort((x,y)=>(x[1].ok/x[1].tot)-(y[1].ok/y[1].tot));
  const areaRows=areaEntries.length?areaEntries.map(([a,v])=>{
    const pc=Math.round(v.ok/v.tot*100), weak=pc<70&&v.tot>=3;
    return `<div class="area-row"><div class="area-top"><span>${esc(a)}</span><span class="${weak?'weak':''}">${v.ok}/${v.tot} · ${pc}%</span></div><div class="bar"><i class="${weak?'weak':''}" style="width:${pc}%"></i></div></div>`;
  }).join(''):'<p class="empty">Resuelve tu primera tanda para ver el diagnóstico por área.</p>';

  app.innerHTML=`
    <header>
      <h1>${esc(DIPLOMADO.titulo||'Exámenes de preparación para Concursos')}</h1>
    </header>

    <div class="box">
      <h2>Panel de avance</h2>
      <p class="box-desc">Este panel de avance resume cuánto material tienes disponible para practicar y cómo te ha ido hasta ahora en las tandas que ya resolviste.</p>
      <div class="panel-body">
        <div class="panel-stats">
          <div class="stat"><b>${list.length}</b><span>Temas</span></div>
          <div class="stat"><b>${totalPreg}</b><span>Preguntas</span></div>
          <div class="stat"><b>${pctGlobal==null?'—':pctGlobal+'%'}</b><span>Desempeño global</span></div>
        </div>
      </div>
    </div>

    <div class="box">
      <p class="box-desc" style="max-width:none;color:var(--ink)">Este banco reúne preguntas de opción múltiple para practicar de cara a concursos de méritos. Cada tema mezcla preguntas Fáciles, Medias y Difíciles, con su explicación al responder, para que identifiques con claridad qué dominas y qué te conviene repasar.</p>
    </div>

    <section>
      <h2 class="section-title">Temas</h2>
      <div class="box topics-box">
        ${topics}
      </div>
    </section>

    <section>
      <h2 class="section-title">Por área</h2>
      ${areaRows}
    </section>`;
}

function startTopic(id){
  const t=dias().find(x=>x.id===id); if(!t)return;
  current={id:t.id,titulo:t.titulo,preguntas:shuffle(t.preguntas.slice()).slice(0,20)};
  idx=0;score=0;results=[];areaTally={};answered=false;
  renderQ(); window.scrollTo({top:0});
}

function renderQ(){
  answered=false;
  const qs=current.preguntas, q=qs[idx];
  bar.style.width=(idx/qs.length*100)+'%';
  let bodyHtml='';
  if(q.t===2){bodyHtml=`<p class="q-text">${esc(q.q)}</p><ol class="statements">${q.s.map(s=>`<li>${esc(s)}</li>`).join('')}</ol>`}
  else if(q.t===3){bodyHtml=`<div class="ar-block"><span class="lbl">Afirmación</span><p class="claim">${esc(q.af)}</p><p class="porque">PORQUE</p><span class="lbl">Razón</span><p class="claim">${esc(q.rz)}</p></div>`}
  else{bodyHtml=`<p class="q-text">${esc(q.q)}</p>`}
  const opts=optionSet(q);
  app.innerHTML=`
    <button class="backlink" onclick="renderDashboard()">← Volver a temas</button>
    <div class="chips">
      <span class="chip">${esc(q.c||'')}</span>
      ${q.d?`<span class="chip n${q.d}">${nivelName[q.d]}</span>`:''}
    </div>
    ${bodyHtml}
    <div class="opts">
      ${opts.map((o,i)=>`<button class="opt" data-i="${i}" onclick="answer(${i})"><span class="letter">${letters[i]}</span><span>${esc(o)}</span></button>`).join('')}
    </div>
    <div id="fb"></div>
    <div class="nav-row">
      <span class="score-live">Aciertos: ${score} / ${idx} · Pregunta ${idx+1} de ${qs.length}</span>
      <span id="nextholder"></span>
    </div>`;
}

function answer(i){
  if(answered)return; answered=true;
  const qs=current.preguntas, q=qs[idx], ok=i===q.a;
  if(ok)score++;
  results.push({i:idx,ok});
  const area=q.c||'General';
  areaTally[area]=areaTally[area]||{ok:0,tot:0};
  areaTally[area].tot++; if(ok)areaTally[area].ok++;
  document.querySelectorAll('.opt').forEach(btn=>{
    const bi=+btn.dataset.i; btn.disabled=true;
    if(bi===q.a)btn.classList.add('correct');
    else if(bi===i)btn.classList.add('wrong');
    else btn.classList.add('dim');
  });
  document.getElementById('fb').innerHTML=`
    <div class="feedback ${ok?'good':'bad'}">
      <span class="verdict">${ok?'Correcto':'Incorrecto — la respuesta era la '+letters[q.a]}</span>
      ${esc(q.e||'')}
      ${q.b?`<span class="basis">${esc(q.b)}</span>`:''}
    </div>`;
  document.getElementById('nextholder').innerHTML=
    `<button class="primary" onclick="next()">${idx===qs.length-1?'Ver resultado':'Siguiente'}</button>`;
  document.querySelector('.score-live').textContent=`Aciertos: ${score} / ${idx+1} · Pregunta ${idx+1} de ${qs.length}`;
}

function next(){
  idx++;
  if(idx<current.preguntas.length){renderQ();window.scrollTo({top:0,behavior:'smooth'})}
  else renderEnd();
}

function renderEnd(){
  bar.style.width='100%';
  const qs=current.preguntas, pct=Math.round(score/qs.length*100);
  saveResult(current.id,{score,total:qs.length,byArea:areaTally,ts:Date.now()});
  let verdict;
  if(pct>=90)verdict='Excelente dominio de este tema.';
  else if(pct>=70)verdict='Buen resultado — repasa las falladas.';
  else if(pct>=55)verdict='Nivel medio, conviene otro repaso.';
  else verdict='Vale la pena reforzar este tema.';
  const wrong=results.filter(r=>!r.ok);
  const review=wrong.length?`
    <h2 class="section-title" style="margin-top:40px">Para repasar</h2>
    ${wrong.map(r=>{const q=qs[r.i];const opts=optionSet(q);const label=q.t===3?q.af:q.q;return `<div class="review-item"><div class="rq">${esc(label)}</div><div class="ra">Respuesta correcta: ${letters[q.a]}) ${esc(opts[q.a])}</div></div>`}).join('')}
  `:'';
  app.innerHTML=`
    <button class="backlink" onclick="renderDashboard()">← Volver a temas</button>
    <div class="result-seal"><span class="pct">${pct}%</span><span class="of">${score} de ${qs.length} correctas · ${esc(current.titulo)}</span></div>
    <p class="verdict-line">${esc(verdict)}</p>
    ${review}
    <div class="center">
      <button class="primary" onclick="renderDashboard()">Volver a temas</button>
      <button class="ghost" onclick="startTopic('${esc(current.id)}')">Otra tanda</button>
    </div>`;
  window.scrollTo({top:0,behavior:'smooth'});
}

renderDashboard();
</script>
</body>
</html>
